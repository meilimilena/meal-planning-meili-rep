<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mahlzeiten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F0">
<title>Familien-Mahlzeiten</title>
<style>
:root{
  --paper:#F2F4F0; --card:#FFFFFF; --ink:#18221C; --muted:#667068; --line:#DCE3DC;
  --green:#2E7D52; --green-rgb:46,125,82; --orange:#DB6F1F; --orange-rgb:219,111,31; --g1:#D3E5DA; --g0:#F3F8F4;
  --serif:ui-serif,"New York",Georgia,serif; --sans:-apple-system,system-ui,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 10px}
h1{font:700 32px/1.05 var(--serif);margin:0;letter-spacing:-.015em}
.nav{display:flex;gap:6px}
.nav button{min-width:40px;height:40px;border-radius:20px;border:0;background:var(--card);font-size:18px;color:var(--ink);padding:0 11px;box-shadow:0 1px 3px rgba(24,34,28,.1)}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 12px}
.sub{color:var(--muted);font-size:14px}
#undoBtn{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:600 14px var(--sans);white-space:nowrap;flex:none;box-shadow:0 1px 3px rgba(24,34,28,.1)}
#undoBtn:disabled{opacity:.4}
main{padding:0 14px}
[hidden]{display:none!important}

.day{display:grid;grid-template-columns:66px minmax(0,1fr);gap:10px;background:var(--card);border-radius:22px;padding:9px;margin-bottom:12px;box-shadow:0 1px 2px rgba(24,34,28,.05),0 8px 18px rgba(24,34,28,.06)}
.day.today{box-shadow:0 0 0 2px var(--orange),0 10px 22px rgba(var(--orange-rgb),.22)}
.dayhd{background:var(--green);color:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;text-align:center}
.day.today .dayhd{background:var(--orange)}
.dn{font:700 21px/1 var(--serif)} .dd{font-size:12px;margin-top:5px;opacity:.88}
.tp{margin-top:6px;font-size:10px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 7px}
.slots{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.slot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:rgba(var(--green-rgb),.11);border-radius:14px;padding:9px 12px;font:inherit;color:var(--ink);min-height:48px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.slot.g1{background:var(--g1)}
.slot.g0{background:var(--g0)}
.slot small{display:block;color:rgba(24,34,28,.6);font-size:12px;margin-bottom:2px}
.slot.empty{background:transparent!important;border:1.5px dashed #C9D3CA;color:var(--muted);display:flex;align-items:center}
.slot b{font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sl-main{flex:1;min-width:0}
.vt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vegtag{flex:none;max-width:42%;line-height:1.25;font-size:12.5px;font-weight:650;padding:6px 10px;border-radius:14px;border:1.5px dashed rgba(var(--green-rgb),.55);color:var(--green)}
.vegtag.has{background:var(--green);border:1.5px solid var(--green);color:#fff}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.vchip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:600 15px var(--sans);color:var(--ink)}
.vchip.add{border-style:dashed;border-color:var(--green);color:var(--green)}
.vchip.on{background:var(--green);border-color:var(--green);color:#fff}
.slot.dragging{opacity:.35}
.slot.over{outline:2.5px solid var(--green);background:rgba(var(--green-rgb),.22)!important}

.av{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(var(--green-rgb),.14);color:var(--green);display:grid;place-items:center;font:700 17px var(--serif)}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:15px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:8px;width:100%;border:0;font:inherit;text-align:left;color:var(--ink);box-shadow:0 1px 2px rgba(24,34,28,.05),0 4px 10px rgba(24,34,28,.04)}
.item.g1{background:var(--g1)}
.item.g0{background:var(--g0)}
.av.g1{background:var(--green);color:#fff}
.leaf{border:0;background:none;color:#B7C0B8;padding:0 6px;align-self:stretch;display:flex;align-items:center}
.leaf.on{color:var(--green)}
.legend{display:flex;gap:16px;margin:0 6px 10px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(24,34,28,.08)}
.sw.g1{background:var(--g1)}
.sw.g0{background:var(--g0)}
.item .n,.rowbtn .n{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.item.has-star{padding:0 0 0 12px;gap:0}
.rowbtn{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;padding:11px 8px 11px 0;min-width:0}
.empty-note{padding:30px 18px;text-align:center;color:var(--muted);line-height:1.5}
.star{border:0;background:none;font-size:23px;line-height:1;color:#B7C0B8;padding:0 16px;align-self:stretch;min-width:52px}
.star.on{color:var(--orange)}

.panel{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(24,34,28,.05),0 8px 18px rgba(24,34,28,.06)}
.panel h2{font:700 20px var(--serif);margin:0 0 6px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.45}
.panel.favs{background:#FFF1E4;box-shadow:inset 0 0 0 1px #F3CFA8}
.favrow{display:flex;align-items:center;gap:10px;border-top:1px solid rgba(var(--orange-rgb),.22);padding:6px 0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.favrow .t{flex:1;font-weight:600}
.item .t,.favrow .t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cur,#sheet h2{overflow-wrap:anywhere}
.favrow .tag{font-size:12px;color:#9A5A22}
.favrow .star{padding:0 2px 0 10px;min-width:42px}
.favrow.dragging{opacity:.35}
.hint{margin:2px 8px 14px;color:var(--muted);font-size:13px;line-height:1.4}
textarea,input[type=text]{width:100%;font:16px var(--sans);color:var(--ink);background:var(--paper);border:1.5px solid transparent;border-radius:14px;padding:12px 14px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--green);background:#fff}
textarea{min-height:96px;resize:vertical}
#lSearch{background:#fff;box-shadow:0 1px 3px rgba(24,34,28,.1)}
.sortrow{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 0}
.sortchip{flex:none;border:0;background:var(--card);border-radius:999px;padding:8px 11px;font:600 13.5px var(--sans);color:var(--muted);box-shadow:0 1px 3px rgba(24,34,28,.1)}
.sortchip.on{background:var(--green);color:#fff}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 17px;font:650 16px var(--sans);background:var(--green);color:#fff;box-shadow:0 4px 10px rgba(var(--green-rgb),.28)}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:none}
.btn.danger{background:transparent;color:#B3261E;box-shadow:none}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.tab{flex:1;border:0;background:none;padding:11px 0;font:650 14px var(--sans);color:var(--muted);border-radius:14px}
.tab.on{color:var(--green);background:rgba(var(--green-rgb),.12)}

#sheetBg{position:fixed;inset:0;background:rgba(24,34,28,.45);display:flex;align-items:flex-end;z-index:5}
#sheet{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
#sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet h2{font:700 22px var(--serif);margin:0 0 12px}
#sheet.dayc h2{border-left:6px solid var(--c);padding-left:10px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.cur{margin:0 0 12px;color:var(--muted)}
.cur b{color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--ink);font-size:16px}
.check input{width:22px;height:22px;flex:none;accent-color:var(--green)}
.ghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-130%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:14px;font-weight:600;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 20px rgba(24,34,28,.35)}
#banner{margin:0 14px 12px;padding:10px 14px;border-radius:14px;background:#FFF1E4;color:#8A4A12;font-size:14px;line-height:1.4}
body.welcome header,body.welcome .subrow,body.welcome main,body.welcome .tabs{display:none}
body.ro main{pointer-events:none;opacity:.75}
body.ro #undoBtn{pointer-events:none;opacity:.4}
.whead{font:700 34px/1.05 var(--serif);padding:26px 6px 14px;letter-spacing:-.015em}
#welcomeView{padding:0 14px}
</style>
</head>
<body>
<header>
  <h1 id="title">Plan</h1>
  <div class="nav" id="nav">
    <button data-a="prev" aria-label="Vorherige Woche">‹</button>
    <button data-a="today" aria-label="Diese Woche" style="font-size:13px;font-weight:600">Heute</button>
    <button data-a="next" aria-label="Nächste Woche">›</button>
  </div>
</header>
<div class="subrow"><div class="sub" id="sub"></div><button id="undoBtn" data-a="undo" disabled>↶ Rückgängig</button></div>
<div id="banner" hidden></div>
<main>
  <section id="week"></section>
  <section id="lib" hidden></section>
  <section id="veg" hidden></section>
  <section id="share" hidden></section>
</main>
<div id="welcomeView" hidden>
  <div class="whead">Familien-<br>Mahlzeiten</div>
  <div class="panel"><h2>Neuen Haushalt anlegen</h2>
    <p>Du richtest den gemeinsamen Haushalt ein. Deine bisherigen Daten auf diesem Gerät werden übernommen. Danach lädst du deinen Partner per Link ein.</p>
    <label for="welcomeCode">Sicherungscode aus der alten App (optional)</label>
    <textarea id="welcomeCode" placeholder="Code hier einfügen" style="min-height:70px"></textarea>
    <div class="row"><button class="btn" data-a="createHousehold">Haushalt anlegen</button></div>
  </div>
  <div class="panel"><h2>Einem Haushalt beitreten</h2>
    <p>Füge den Link oder den Code ein, den du bekommen hast.</p>
    <input type="text" id="joinInput" placeholder="Link oder Code" autocomplete="off" autocapitalize="off" autocorrect="off">
    <div class="row"><button class="btn" data-a="joinHousehold">Beitreten</button></div>
  </div>
</div>
<nav class="tabs">
  <button class="tab" data-tab="week">Plan</button>
  <button class="tab" data-tab="lib">Mahlzeiten</button>
  <button class="tab" data-tab="veg">Gemüse</button>
  <button class="tab" data-tab="share">Teilen</button>
</nav>
<div id="sheetBg" hidden><div id="sheet"></div></div>
<div id="toast" hidden></div>

<script>
(function(){
const KEY='family-meals-v1';
// ====== FIREBASE-KONFIGURATION (siehe Setup-Anleitung, Kapitel 5) ======
const FIREBASE_CONFIG={
  apiKey:'AIzaSyBUJg5DLddNbD1-ZXZP0VcaRMT-rL4jVTo',
  authDomain:'meal-planning-meili.firebaseapp.com',
  projectId:'meal-planning-meili',
  storageBucket:'meal-planning-meili.firebasestorage.app',
  messagingSenderId:'213318403074',
  appId:'1:213318403074:web:4e5657ac26ca4866b2931b'
};
// =======================================================================
const APP_VERSION='2.0 (Cloud) · 08.10.2026';
const CLOUD=!!FIREBASE_CONFIG.apiKey&&!/^DEIN/.test(FIREBASE_CONFIG.apiKey)&&!!FIREBASE_CONFIG.projectId&&!/^DEIN/.test(FIREBASE_CONFIG.projectId);
const HKEY='family-meals-hid';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let hid=ls.get(HKEY)||null;
const mh=(location.hash||'').match(/h=([a-z0-9]{16,64})/i);
const hashId=mh?mh[1].toLowerCase():null;
const SLOTS=[['lunch','Mittagessen','☀︎'],['dinner','Abendessen','☾']];
const av=(n,cls)=>`<span class="av ${cls||''}">${esc((Array.from(String(n).trim())[0]||'?').toUpperCase())}</span>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Speicher mit Fallback im Arbeitsspeicher
let mem=null;
const store={
  get(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):mem}catch(e){return mem}},
  set(v){mem=v;try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
};
let state=store.get()||{meals:{},library:{}};
state.meals=state.meals||{};state.library=state.library||{};state.veg=state.veg||[];
// Cloud (Firebase) und Rückgängig
const cloud={ok:false,ready:false,F:null,db:null,ref:null,base:null,unsub:null,latest:null,retry:null};
const clone=o=>JSON.parse(JSON.stringify(o));
const j=JSON.stringify;
const snapObj=()=>clone({meals:state.meals,library:state.library,veg:state.veg});
let lastObj=snapObj();
const undoStack=[];
function updateUndo(){const b=$('#undoBtn');if(b)b.disabled=!undoStack.length}
function save(){
  const cur=snapObj();
  if(j(cur)!==j(lastObj)){undoStack.push({before:lastObj,after:cur});if(undoStack.length>30)undoStack.shift();lastObj=cur}
  persist();updateUndo();
}
function persist(){store.set(state);pushRemote()}
function undo(){
  const e=undoStack.pop();if(!e)return;
  const {before,after}=e;
  let changed=false;
  for(const part of ['meals','library']){
    const keys=new Set([...Object.keys(before[part]||{}),...Object.keys(after[part]||{})]);
    keys.forEach(k=>{
      const b=(before[part]||{})[k],a=(after[part]||{})[k];
      if(j(b)!==j(a)&&j(state[part][k])===j(a)){
        if(b===undefined)delete state[part][k];else state[part][k]=clone(b);
        changed=true;
      }
    });
  }
  if(j(before.veg)!==j(after.veg)&&j(state.veg)===j(after.veg)){state.veg=clone(before.veg);changed=true}
  lastObj=snapObj();persist();render();
  toast(changed?'Rückgängig gemacht':'Wurde inzwischen geändert, nichts zurückgesetzt');
}

function setBanner(msg){const b=$('#banner');if(!msg){b.hidden=true;return}b.textContent=msg;b.hidden=false}
function cloudError(e){
  const c=(e&&e.code)||'';
  let m='Keine Verbindung zum Server. Du siehst den zuletzt gespeicherten Stand. Änderungen sind erst wieder möglich, wenn du online bist.';
  if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')m='Die anonyme Anmeldung ist in Firebase noch nicht aktiviert (Setup-Anleitung, Kapitel 3).';
  else if(c==='permission-denied')m='Zugriff verweigert. Bitte die Firestore-Regeln prüfen (Setup-Anleitung, Kapitel 4).';
  else if(c.indexOf('api-key')>=0)m='Die Firebase-Konfiguration stimmt nicht (Setup-Anleitung, Kapitel 5).';
  setBanner(m);
  if(window.console)console.error(e);
}
const ALPH='abcdefghjkmnpqrstuvwxyz23456789';
function randomId(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>ALPH[x%ALPH.length]).join('')}
function parseHid(raw){
  raw=String(raw||'');
  const m=raw.match(/h=([a-z0-9-]{16,70})/i);
  const t=(m?m[1]:raw).replace(/[^a-z0-9]/gi,'').toLowerCase();
  return t.length>=16&&t.length<=64?t:null;
}
const hasLocalData=()=>Object.keys(state.meals).length>0||Object.keys(state.library).length>0||state.veg.length>0;
const inviteLink=()=>location.href.split('#')[0]+'#h='+hid;
function cloudStatusText(){
  if(!cloud.ready)return 'Verbindung wird aufgebaut …';
  return navigator.onLine?'Verbunden. Änderungen erscheinen bei euch beiden sofort.':'Offline. Änderungen werden hochgeladen, sobald du wieder online bist.';
}

async function pushRemote(){
  if(!cloud.ok||!cloud.ready||!cloud.ref||!cloud.base)return;
  const cur=snapObj(),base=cloud.base,F=cloud.F,args=[];
  for(const part of ['meals','library']){
    const a=base[part]||{},b=cur[part]||{};
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{
      if(j(a[k])!==j(b[k])){args.push(new F.FieldPath(part,k));args.push(b[k]===undefined?F.deleteField():b[k])}
    });
  }
  if(j(base.veg)!==j(cur.veg)){args.push('veg');args.push(cur.veg)}
  if(!args.length)return;
  cloud.base=cur;
  try{await F.updateDoc(cloud.ref,...args)}catch(e){cloudError(e);toast('Speichern fehlgeschlagen')}
}
function applyRemote(d){
  cloud.latest=d;
  if(typeof drag!=='undefined'&&drag){clearTimeout(cloud.retry);cloud.retry=setTimeout(()=>applyRemote(cloud.latest),400);return}
  state.meals=d.meals||{};state.library=d.library||{};state.veg=Array.isArray(d.veg)?d.veg:[];
  cloud.base=clone({meals:state.meals,library:state.library,veg:state.veg});
  lastObj=snapObj();
  store.set(state);
  const q1=tab==='lib'&&$('#lSearch')?$('#lSearch').value:'';
  const q2=tab==='veg'&&$('#vSearch')?$('#vSearch').value:'';
  render();
  if(q1){$('#lSearch').value=q1;$('#lList').innerHTML=mealList(q1,'data-edit')}
  if(q2){$('#vSearch').value=q2;$('#vList').innerHTML=vegListHtml(q2)}
}
function leaveLocal(){
  if(cloud.unsub){cloud.unsub();cloud.unsub=null}
  cloud.ready=false;cloud.ref=null;cloud.base=null;hid=null;ls.del(HKEY);
  document.body.classList.remove('ro');render();
}
function listen(){
  if(cloud.unsub){cloud.unsub();cloud.unsub=null}
  cloud.ready=false;
  cloud.ref=cloud.F.doc(cloud.db,'households',hid);
  document.body.classList.add('ro');
  cloud.unsub=cloud.F.onSnapshot(cloud.ref,snap=>{
    if(!snap.exists()){
      if(!snap.metadata.fromCache){toast('Haushalt nicht gefunden');leaveLocal()}
      return;
    }
    cloud.ready=true;
    document.body.classList.remove('ro');setBanner('');
    applyRemote(snap.data());
  },err=>cloudError(err));
}
async function startCloud(){
  document.body.classList.add('ro');
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);
    await Au.signInAnonymously(Au.getAuth(app));
    cloud.F=F;cloud.db=F.initializeFirestore(app,{localCache:F.persistentLocalCache()});
    cloud.ok=true;
    if(!hid&&hashId)await joinHousehold(hashId);
    if(hid&&!cloud.unsub)listen();
    else if(!hid){document.body.classList.remove('ro');render()}
  }catch(e){cloudError(e)}
}
async function createHousehold(){
  if(!cloud.ok){toast('Verbindung wird aufgebaut …');return}
  const raw=($('#welcomeCode')||{}).value||'';
  if(raw.trim()){
    try{
      const inc=decode(raw);if(!inc||typeof inc.meals!=='object')throw new Error('x');
      state.meals=inc.meals||{};state.library=inc.library||{};state.veg=Array.isArray(inc.veg)?inc.veg:[];
    }catch(e){toast('Der Sicherungscode funktioniert nicht');return}
  }
  const id=randomId(24),F=cloud.F;
  try{
    await F.setDoc(F.doc(cloud.db,'households',id),Object.assign(snapObj(),{created:F.serverTimestamp()}));
    hid=id;ls.set(HKEY,id);store.set(state);
    tab='share';listen();toast('Haushalt angelegt');
  }catch(e){cloudError(e)}
}
async function joinHousehold(raw){
  const id=parseHid(raw);
  if(!id){toast('Link oder Code nicht erkannt');return false}
  if(!cloud.ok){toast('Verbindung wird aufgebaut …');return false}
  if(hasLocalData()&&!confirm('Auf diesem Gerät sind schon Daten. Beitreten ersetzt sie durch die gemeinsamen Daten. Fortfahren?'))return false;
  try{
    const snap=await cloud.F.getDoc(cloud.F.doc(cloud.db,'households',id));
    if(!snap.exists()){toast('Haushalt nicht gefunden');return false}
    hid=id;ls.set(HKEY,id);tab='week';listen();return true;
  }catch(e){cloudError(e);return false}
}
function leaveHousehold(){
  if(!confirm('Dieses Gerät vom Haushalt trennen? Die Daten bleiben in der Cloud erhalten. Mit dem Link kannst du jederzeit wieder beitreten.'))return;
  leaveLocal();
}

// Daten
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const short=d=>d.toLocaleDateString('de-CH',{day:'numeric',month:'short'});
const wd=d=>d.toLocaleDateString('de-CH',{weekday:'short'});
let weekStart=mondayOf(new Date());
let tab='week';
const weekRange=()=>short(weekStart)+' – '+short(addDays(weekStart,6));
const slotLabel=s=>s==='lunch'?'Mittagessen':'Abendessen';

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}

function render(){
  const needWelcome=CLOUD&&!hid;
  document.body.classList.toggle('welcome',needWelcome);
  $('#welcomeView').hidden=!needWelcome;
  if(needWelcome)return;
  for(const id of ['week','lib','veg','share'])$('#'+id).hidden=tab!==id;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#nav').hidden=tab!=='week';
  $('#title').textContent={week:'Plan',lib:'Meine Mahlzeiten',veg:'Gemüse',share:'Teilen'}[tab];
  const n=Object.keys(state.library).length;
  $('#sub').textContent=tab==='share'?'Einladen und Sicherung':tab==='lib'?(n?n+(n===1?' Mahlzeit':' Mahlzeiten'):'Deine Liste möglicher Mahlzeiten'):tab==='veg'?(state.veg.length?state.veg.length+' Gemüse':'Deine Gemüseliste'):weekRange();
  if(tab==='week')renderWeek();else if(tab==='lib')renderLib();else if(tab==='veg')renderVeg();else renderShare();
  updateUndo();
}

function plannedNames(){
  const set=new Set();
  for(let i=0;i<7;i++){
    const m=state.meals[keyOf(addDays(weekStart,i))]||{};
    for(const [sl] of SLOTS){if(m[sl]&&m[sl].name)set.add(m[sl].name.toLowerCase())}
  }
  return set;
}
function favList(){
  return Object.entries(state.library).filter(([k,m])=>m.fav).sort((a,b)=>a[1].name.localeCompare(b[1].name));
}

function renderWeek(){
  const todayKey=keyOf(new Date());
  let h='';
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i),k=keyOf(d),m=state.meals[k]||{};
    h+=`<div class="day ${k===todayKey?'today':''}"><div class="dayhd"><div class="dn">${wd(d)}</div><div class="dd">${short(d)}</div>${k===todayKey?'<div class="tp">Heute</div>':''}</div><div class="slots">`;
    for(const [s,label,ic] of SLOTS){
      const e=m[s];
      h+=e&&e.name
        ?`<button class="slot ${hasG(e)?'g1':'g0'}" data-k="${k}" data-s="${s}"><span class="sl-main"><small>${ic} ${label}</small><b>${esc(e.name)}</b></span>${mealGreens(e)&&!(e.veg&&e.veg.length)?'':vegTag(e)}</button>`
        :`<button class="slot empty" data-k="${k}" data-s="${s}">+ ${label}</button>`;
    }
    h+='</div></div>';
  }
  const favs=favList(),planned=plannedNames();
  h+=legendHtml();
  h+='<p class="hint">Tipp: Halte eine Mahlzeit oder einen Favoriten gedrückt und ziehe sie auf einen Platz, um sie zu verschieben, zu tauschen oder einzusetzen. Über «+ Gemüse» rechts fügst du Gemüse zu einer Mahlzeit hinzu.</p>';
  h+=`<div class="panel favs"><h2><span style="color:var(--orange)">★</span> Favoriten</h2><p>Mahlzeiten, die du bald kochen möchtest.</p>`;
  h+=favs.length
    ?favs.map(([k,m])=>`<div class="favrow" data-key="${esc(k)}">${av(m.name,'sm'+(m.greens?' g1':''))}<span class="t">${esc(m.name)}</span>${planned.has(k)?'<span class="tag">diese Woche geplant</span>':''}<button class="star on" data-fav="${esc(k)}" aria-label="Aus Favoriten entfernen">★</button></div>`).join('')
    :'<p style="margin:0">Noch keine Favoriten. Tippe im Reiter «Mahlzeiten» auf den Stern neben einer Mahlzeit.</p>';
  h+='</div>';
  $('#week').innerHTML=h;
}

function encode(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}
function decode(str){return JSON.parse(decodeURIComponent(escape(atob(str.trim()))))}

// Mahlzeitenliste
function plannedCounts(){
  const c={};
  for(const k in state.meals)for(const sl in state.meals[k]){
    const e=state.meals[k][sl];
    if(e&&e.name){const n=e.name.toLowerCase();c[n]=(c[n]||0)+1}
  }
  return c;
}
function mealList(q,attr){
  const mode=attr==='data-edit'?(state.sort||'fav'):'fav';
  const counts=mode==='count'?plannedCounts():{};
  const az=(a,b)=>a[1].name.localeCompare(b[1].name);
  const cmp={
    fav:(a,b)=>(!!b[1].fav-!!a[1].fav)||az(a,b),
    az,
    new:(a,b)=>((b[1].added||0)-(a[1].added||0))||az(a,b),
    count:(a,b)=>((counts[b[0]]||0)-(counts[a[0]]||0))||az(a,b)
  }[mode]||az;
  const items=Object.entries(state.library)
    .filter(([k])=>!q||k.includes(q.trim().toLowerCase()))
    .sort(cmp);
  if(!items.length)return q
    ?'<div class="empty-note">Keine Mahlzeit gefunden.</div>'
    :'<div class="empty-note">Noch keine Mahlzeiten.<br>Füge die Mahlzeiten hinzu, die ihr esst, und wähle sie dann für jeden Tag aus.</div>';
  const cnt=(m,k)=>{
    if(mode==='count'){const n=counts[k]||0;return n?n+'× geplant':''}
    return m.ingredients&&m.ingredients.length?m.ingredients.length+(m.ingredients.length===1?' Zutat':' Zutaten'):'';
  };
  if(attr==='data-edit')return items.map(([k,m])=>`<div class="item has-star ${m.greens?'g1':'g0'}"><button class="rowbtn" data-edit="${esc(k)}">${av(m.name,m.greens?'g1':'')}<span class="t">${esc(m.name)}</span><span class="n">${cnt(m,k)}</span></button><button class="leaf ${m.greens?'on':''}" data-greens="${esc(k)}" aria-label="${m.greens?'Enthält Gemüse':'Enthält kein Gemüse'}"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 20c0-9 5.5-15 16-16 0 10.500-6 16-15 16z" fill="currentColor"/><path d="M5 19.500l8.500-8.500" stroke="#fff" stroke-width="1.600" fill="none" stroke-linecap="round"/></svg></button><button class="star ${m.fav?'on':''}" data-fav="${esc(k)}" aria-label="${m.fav?'Aus Favoriten entfernen':'Zu Favoriten hinzufügen'}">${m.fav?'★':'☆'}</button></div>`).join('');
  return items.map(([k,m])=>`<button class="item ${m.greens?'g1':'g0'}" ${attr}="${esc(k)}">${av(m.name,m.greens?'g1':'')}<span class="t">${m.fav?'★ ':''}${esc(m.name)}</span><span class="n">${cnt(m,k)}</span></button>`).join('');
}
function toggleFav(key){
  const m=state.library[key];if(!m)return;
  m.fav=!m.fav;save();
  if(tab==='lib'){const q=$('#lSearch');$('#lList').innerHTML=mealList(q?q.value:'','data-edit')}
  else render();
  toast(m.fav?m.name+' ist ein Favorit':'Aus Favoriten entfernt');
}
function toggleGreens(key){
  const m=state.library[key];if(!m)return;
  m.greens=!m.greens;save();
  const q=$('#lSearch');$('#lList').innerHTML=mealList(q?q.value:'','data-edit');
  toast(m.greens?m.name+': enthält Gemüse':m.name+': ohne Gemüse');
}
function renderLib(){
  const cur=state.sort||'fav';
  const modes=[['fav','★ Favoriten'],['az','A–Z'],['new','Neueste'],['count','Häufigste']];
  const sortRow='<div class="sortrow">'+modes.map(([m,l])=>`<button class="sortchip ${m===cur?'on':''}" data-sort="${m}">${l}</button>`).join('')+'</div>';
  $('#lib').innerHTML=`<div class="row" style="margin:0 0 10px;flex-wrap:nowrap"><input type="text" id="lSearch" placeholder="Mahlzeiten suchen" autocomplete="off"><button class="btn" data-a="newLib" style="white-space:nowrap">+ Neu</button></div>${sortRow}${legendHtml()}<div id="lList">${mealList('','data-edit')}</div>`;
}

// Fenster (Sheet)
let ctx=null;
function showSheet(){$('#sheetBg').hidden=false}
function closeSheet(){$('#sheetBg').hidden=true;ctx=null}

function openPicker(k,s){
  ctx={mode:'pick',k,s};
  const e=(state.meals[k]||{})[s];
  const d=new Date(k+'T00:00:00');
  const has=Object.keys(state.library).length>0;
  $('#sheet').innerHTML=`
    <h2>${slotLabel(s)} · ${wd(d)} ${short(d)}</h2>
    ${e&&e.name?`<p class="cur">Aktuell: <b>${esc(e.name)}</b></p>`:''}
    ${has?'<input type="text" id="pSearch" placeholder="Deine Mahlzeiten durchsuchen" autocomplete="off">':''}
    <div id="pList" style="margin-top:10px">${mealList('','data-pick')}</div>
    <div class="row"><button class="btn" data-a="newPlan">+ Neue Mahlzeit</button><button class="btn alt" data-a="closeSheet">Abbrechen</button>${e&&e.name?'<button class="btn danger" data-a="clearSlot">Entfernen</button>':''}</div>`;
  const sh=$('#sheet');sh.className='dayc';sh.style.cssText=`--c:${s==='dinner'?'var(--orange)':'var(--green)'}`;

function pickMeal(key){
  const m=state.library[key];if(!m||!ctx)return;
  const {k,s}=ctx;
  state.meals[k]=state.meals[k]||{};
  const old=state.meals[k][s];
  state.meals[k][s]={name:m.name,ingredients:(m.ingredients||[]).slice(),greens:!!m.greens};
  if(old&&old.veg&&old.veg.length)state.meals[k][s].veg=old.veg.slice();
  save();closeSheet();render();toast(m.name+' hinzugefügt');
}
function clearSlot(){
  const {k,s}=ctx;
  if(state.meals[k]){delete state.meals[k][s];if(!Object.keys(state.meals[k]).length)delete state.meals[k]}
  save();closeSheet();render();toast('Mahlzeit entfernt');
}

function openForm(c){
  ctx=c;
  $('#sheet').className='';$('#sheet').style.cssText='';
  const m=c.mode==='lib'&&c.orig?state.library[c.orig]:null;
  $('#sheet').innerHTML=`
    <h2>${m?'Mahlzeit bearbeiten':'Neue Mahlzeit'}</h2>
    <label for="fName">Name der Mahlzeit</label>
    <input type="text" id="fName" value="${esc(m?m.name:'')}" placeholder="z. B. Pasta mit Tomatensauce" autocomplete="off">
    <label for="fIng">Zutaten, optional (eine pro Zeile)</label>
    <textarea id="fIng" placeholder="Spaghetti&#10;Tomaten&#10;Basilikum">${esc(m&&m.ingredients?m.ingredients.join('\n'):'')}</textarea>
    <label class="check"><input type="checkbox" id="fFav" ${m&&m.fav?'checked':''}> Favorit</label>
    <label class="check"><input type="checkbox" id="fGreens" ${m&&m.greens?'checked':''}> Enthält bereits Gemüse</label>
    <div class="row"><button class="btn" data-a="saveForm">Mahlzeit speichern</button><button class="btn alt" data-a="closeSheet">Abbrechen</button>${m?'<button class="btn danger" data-a="deleteMeal">Löschen</button>':''}</div>`;
  showSheet();
}
function saveForm(){
  const name=$('#fName').value.trim();
  const ing=$('#fIng').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!name){toast('Bitte einen Namen eingeben');return}
  const low=name.toLowerCase();
  const orig=ctx.mode==='lib'?ctx.orig:null;
  if(state.library[low]&&low!==orig){toast('Diese Mahlzeit gibt es schon in deiner Liste');return}
  const prevAdded=orig&&state.library[orig]?state.library[orig].added:undefined;
  if(orig){
    delete state.library[orig];
    for(const k in state.meals)for(const sl in state.meals[k]){
      const e=state.meals[k][sl];
      if(e&&e.name&&e.name.toLowerCase()===orig)state.meals[k][sl]=Object.assign({},e,{name,ingredients:ing,greens:$('#fGreens').checked});
    }
  }
  state.library[low]={name,ingredients:ing,fav:$('#fFav').checked,greens:$('#fGreens').checked,added:orig?prevAdded:Date.now()};
  if(ctx.mode==='plan'){
    state.meals[ctx.k]=state.meals[ctx.k]||{};
    state.meals[ctx.k][ctx.s]=Object.assign({},state.meals[ctx.k][ctx.s]||{},{name,ingredients:ing,greens:$('#fGreens').checked});
  }
  save();closeSheet();render();toast('Mahlzeit gespeichert');
}
function deleteMeal(){
  if(!confirm('Diese Mahlzeit aus deiner Liste löschen? Tage, die sie bereits verwenden, behalten sie.'))return;
  delete state.library[ctx.orig];
  save();closeSheet();render();toast('Mahlzeit gelöscht');
}

// Gemüse
const VEG_SUGGEST=['Brokkoli','Karotten','Zucchetti','Spinat','Blumenkohl','Erbsen','Bohnen','Peperoni','Fenchel','Randen','Kohlrabi','Lauch','Gurke','Tomaten','Salat'];
function mealGreens(e){
  const m=e&&e.name?state.library[e.name.toLowerCase()]:null;
  return m?!!m.greens:!!(e&&e.greens);
}
function hasG(e){return mealGreens(e)||!!(e&&e.veg&&e.veg.length)}
const legendHtml=()=>'<div class="legend"><span><i class="sw g1"></i>mit Gemüse</span><span><i class="sw g0"></i>ohne Gemüse</span></div>';
function vegHas(n){return state.veg.some(v=>v.toLowerCase()===String(n).toLowerCase())}
function vegTag(e){return e.veg&&e.veg.length?`<span class="vegtag has"><span class="vt">${esc(e.veg.join(', '))}</span></span>`:'<span class="vegtag"><span class="vt">+ Gemüse</span></span>'}
function vegCounts(){
  const c={};
  for(const k in state.meals)for(const sl in state.meals[k]){
    const e=state.meals[k][sl];
    ((e&&e.veg)||[]).forEach(v=>{const n=v.toLowerCase();c[n]=(c[n]||0)+1});
  }
  return c;
}
function vegNames(e){
  const names=state.veg.slice();
  ((e&&e.veg)||[]).forEach(v=>{if(!names.some(x=>x.toLowerCase()===v.toLowerCase()))names.push(v)});
  return names.sort((a,b)=>a.localeCompare(b));
}
function addVegName(raw){
  const n=String(raw||'').trim();
  if(!n){toast('Bitte ein Gemüse eingeben');return false}
  if(vegHas(n)){toast('Dieses Gemüse gibt es schon');return false}
  state.veg.push(n);save();return true;
}
function vegListHtml(q){
  q=(q||'').trim().toLowerCase();
  const all=state.veg.slice().sort((a,b)=>a.localeCompare(b));
  if(!all.length)return '<div class="empty-note">Noch kein Gemüse in der Liste.<br>Hier sammelst du Gemüse, das du bei Mahlzeiten ergänzen kannst.</div><div class="row" style="justify-content:center"><button class="btn alt" data-a="vegSuggest">Vorschläge einfügen</button></div>';
  const list=all.filter(v=>!q||v.toLowerCase().includes(q));
  if(!list.length)return '<div class="empty-note">Kein Gemüse gefunden.</div>';
  const counts=vegCounts();
  return list.map(v=>{const n=counts[v.toLowerCase()]||0;return `<div class="item has-star"><span class="rowbtn">${av(v)}<span class="t">${esc(v)}</span><span class="n">${n?n+'× geplant':''}</span></span><button class="star" data-delveg="${esc(v)}" aria-label="Gemüse löschen" style="font-size:19px">✕</button></div>`}).join('');
}
function renderVeg(){
  $('#veg').innerHTML='<div class="row" style="margin:0 0 12px;flex-wrap:nowrap"><input type="text" id="vSearch" placeholder="Gemüse suchen" autocomplete="off"><button class="btn" data-a="newVeg" style="white-space:nowrap">+ Neu</button></div><div id="vList">'+vegListHtml('')+'</div>';
}
function drawVeg(){
  const {k,s}=ctx;const e=getSlot(k,s)||{name:''};
  const d=new Date(k+'T00:00:00');
  const names=vegNames(e);
  $('#sheet').innerHTML=`
    <h2>Gemüse · ${slotLabel(s)} · ${wd(d)} ${short(d)}</h2>
    <p class="cur">Zu: <b>${esc(e.name)}</b></p>
    <div class="vchips">${names.map(v=>`<button class="vchip ${ctx.sel.has(v.toLowerCase())?'on':''}" data-vegpick="${esc(v)}">${esc(v)}</button>`).join('')}<button class="vchip add" data-a="newVegSheet">+ Neu</button></div>
    <div class="row"><button class="btn" data-a="vegDone">Fertig</button><button class="btn alt" data-a="closeSheet">Abbrechen</button></div>`;
}
function openVegForm(back){
  ctx={mode:'vegform',back:back||null};
  if(!back){$('#sheet').className='';$('#sheet').style.cssText=''}
  $('#sheet').innerHTML=`
    <h2>Neues Gemüse</h2>
    <label for="vName">Name des Gemüses</label>
    <input type="text" id="vName" placeholder="z. B. Brokkoli" autocomplete="off">
    <div class="row"><button class="btn" data-a="saveVegForm">Gemüse speichern</button><button class="btn alt" data-a="cancelVegForm">Abbrechen</button></div>`;
  showSheet();
}
function saveVegForm(){
  const n=$('#vName').value.trim();
  if(!n){toast('Bitte ein Gemüse eingeben');return}
  const back=ctx.back;
  const ex=state.veg.find(v=>v.toLowerCase()===n.toLowerCase());
  if(ex&&!back){toast('Dieses Gemüse gibt es schon');return}
  if(!ex){state.veg.push(n);save()}
  if(back){back.sel.add((ex||n).toLowerCase());ctx=back;drawVeg();toast(ex?'Gemüse ausgewählt':'Gemüse hinzugefügt')}
  else{closeSheet();render();toast('Gemüse hinzugefügt')}
}
function cancelVegForm(){
  if(ctx&&ctx.back){ctx=ctx.back;drawVeg()}else closeSheet();
}
function openVeg(k,s){
  const e=getSlot(k,s);if(!e)return;
  ctx={mode:'veg',k,s,sel:new Set((e.veg||[]).map(v=>v.toLowerCase()))};
  drawVeg();
  const sh=$('#sheet');sh.className='dayc';sh.style.cssText=`--c:${s==='dinner'?'var(--orange)':'var(--green)'}`;
  showSheet();
}
function vegDone(){
  const {k,s,sel}=ctx;const e=getSlot(k,s);
  if(e){
    const ne=Object.assign({},e);
    const chosen=vegNames(e).filter(v=>sel.has(v.toLowerCase()));
    if(chosen.length)ne.veg=chosen;else delete ne.veg;
    putSlot(k,s,ne);
  }
  save();closeSheet();render();toast('Gemüse gespeichert');
}

// Ereignisse
document.addEventListener('click',ev=>{
  if(suppressClick){ev.preventDefault();return}
  const vt=ev.target.closest&&ev.target.closest('.vegtag');
  if(vt){const sl=vt.closest('.slot');if(sl)openVeg(sl.dataset.k,sl.dataset.s);return}
  const t=ev.target.closest('button');if(!t){if(ev.target.id==='sheetBg')closeSheet();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.classList.contains('slot')){openPicker(t.dataset.k,t.dataset.s);return}
  if(t.dataset.sort){
    state.sort=t.dataset.sort;store.set(state);
    document.querySelectorAll('.sortchip').forEach(b=>b.classList.toggle('on',b.dataset.sort===state.sort));
    $('#lList').innerHTML=mealList($('#lSearch').value,'data-edit');
    return;
  }
  if(t.dataset.vegpick){
    const n=t.dataset.vegpick.toLowerCase();
    if(ctx.sel.has(n))ctx.sel.delete(n);else ctx.sel.add(n);
    t.classList.toggle('on');return;
  }
  if(t.dataset.delveg){
    state.veg=state.veg.filter(v=>v!==t.dataset.delveg);
    save();render();toast('Gemüse gelöscht');return;
  }
  if(t.dataset.greens){toggleGreens(t.dataset.greens);return}
  if(t.dataset.fav){toggleFav(t.dataset.fav);return}
  if(t.dataset.pick){pickMeal(t.dataset.pick);return}
  if(t.dataset.edit){openForm({mode:'lib',orig:t.dataset.edit});return}
  switch(t.dataset.a){
    case 'undo':undo();break;
    case 'prev':weekStart=addDays(weekStart,-7);render();break;
    case 'next':weekStart=addDays(weekStart,7);render();break;
    case 'today':weekStart=mondayOf(new Date());render();break;
    case 'newVeg':openVegForm(null);break;
    case 'newVegSheet':openVegForm(ctx);break;
    case 'saveVegForm':saveVegForm();break;
    case 'cancelVegForm':cancelVegForm();break;
    case 'vegSuggest':VEG_SUGGEST.forEach(v=>{if(!vegHas(v))state.veg.push(v)});save();render();break;
    case 'vegDone':vegDone();break;
    case 'newLib':openForm({mode:'lib',orig:null});break;
    case 'newPlan':openForm({mode:'plan',k:ctx.k,s:ctx.s});break;
    case 'saveForm':saveForm();break;
    case 'deleteMeal':deleteMeal();break;
    case 'clearSlot':clearSlot();break;
    case 'closeSheet':closeSheet();break;
    case 'createHousehold':createHousehold();break;
    case 'joinHousehold':joinHousehold($('#joinInput').value);break;
    case 'leaveHousehold':leaveHousehold();break;
    case 'copyLink':{
      const v=$('#linkOut').value;
      (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Link kopiert')).catch(()=>{$('#linkOut').select();document.execCommand('copy');toast('Link kopiert')});
      break}
    case 'shareLink':navigator.share({title:'Familien-Mahlzeiten',url:inviteLink()}).catch(()=>{});break;
    case 'copy':{
      const v=$('#out').value;
      (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Code kopiert')).catch(()=>{$('#out').select();document.execCommand('copy');toast('Code kopiert')});
      break}
    case 'send':navigator.share({title:'Mahlzeitenplan',text:$('#out').value}).catch(()=>{});break;
    case 'merge':case 'replace':{
      let inc;try{inc=decode($('#inp').value)}catch(e){toast('Dieser Code funktioniert nicht');return}
      if(!inc||typeof inc.meals!=='object'){toast('Dieser Code funktioniert nicht');return}
      if(t.dataset.a==='replace'){
        if(!confirm('Deinen ganzen Plan durch den erhaltenen ersetzen?'))return;
        state.meals=inc.meals||{};state.library=inc.library||{};state.veg=inc.veg||[];
      }else{
        for(const k in inc.meals){state.meals[k]=Object.assign(state.meals[k]||{},inc.meals[k])}
        Object.assign(state.library,inc.library||{});
        for(const v of (inc.veg||[]))if(!vegHas(v))state.veg.push(v);
      }
      save();toast(t.dataset.a==='replace'?'Plan ersetzt':'Plan zusammengeführt');tab='week';render();break}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  if(ev.target.id==='vName'){ev.preventDefault();saveVegForm()}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='vSearch')$('#vList').innerHTML=vegListHtml(ev.target.value);
  if(ev.target.id==='lSearch')$('#lList').innerHTML=mealList(ev.target.value,'data-edit');
  if(ev.target.id==='pSearch')$('#pList').innerHTML=mealList(ev.target.value,'data-pick');
});

// Ziehen und Ablegen
let drag=null,press=null,suppressClick=false;
function getSlot(k,s){return (state.meals[k]||{})[s]||null}
function putSlot(k,s,v){
  if(v){state.meals[k]=state.meals[k]||{};state.meals[k][s]=v}
  else if(state.meals[k]){delete state.meals[k][s];if(!Object.keys(state.meals[k]).length)delete state.meals[k]}
}
function swapSlots(k1,s1,k2,s2){
  const a=getSlot(k1,s1),b=getSlot(k2,s2);
  putSlot(k1,s1,b);putSlot(k2,s2,a);
  save();render();toast(b?'Mahlzeiten getauscht':'Mahlzeit verschoben');
}
function clearOver(){document.querySelectorAll('.slot.over').forEach(e=>e.classList.remove('over'))}
function moveGhost(){drag.ghost.style.left=drag.x+'px';drag.ghost.style.top=drag.y+'px'}
function updateTarget(){
  if(!drag)return;
  const el=document.elementFromPoint(drag.x,drag.y);
  const slot=el&&el.closest?el.closest('.slot'):null;
  clearOver();drag.target=null;
  if(slot&&slot!==drag.src){slot.classList.add('over');drag.target=slot}
}
function startDrag(){
  if(!press)return;
  const src=press.el;
  const ghost=document.createElement('div');
  ghost.className='ghost';ghost.textContent=src.querySelector(src.classList.contains('favrow')?'.t':'b').textContent;
  document.body.appendChild(ghost);
  drag={src,ghost,x:press.x,y:press.y,target:null,dir:0,timer:setInterval(()=>{
    if(drag&&drag.dir){window.scrollBy(0,drag.dir*12);updateTarget()}
  },16)};
  press=null;
  src.classList.add('dragging');moveGhost();
  if(navigator.vibrate)navigator.vibrate(15);
}
function finishDrag(cancel){
  if(press){clearTimeout(press.timer);press=null}
  if(!drag)return;
  const src=drag.src,tgt=drag.target;
  clearInterval(drag.timer);drag.ghost.remove();src.classList.remove('dragging');clearOver();
  drag=null;
  suppressClick=true;setTimeout(()=>{suppressClick=false},400);
  if(!cancel&&tgt){
    if(src.classList.contains('favrow')){
      const m=state.library[src.dataset.key];
      if(m){
        const had=!!getSlot(tgt.dataset.k,tgt.dataset.s);
        const oldE=getSlot(tgt.dataset.k,tgt.dataset.s);
        const ne={name:m.name,ingredients:(m.ingredients||[]).slice(),greens:!!m.greens};
        if(oldE&&oldE.veg&&oldE.veg.length)ne.veg=oldE.veg.slice();
        putSlot(tgt.dataset.k,tgt.dataset.s,ne);
        save();render();toast(had?m.name+' eingesetzt (ersetzt)':m.name+' eingesetzt');
      }
    }else swapSlots(src.dataset.k,src.dataset.s,tgt.dataset.k,tgt.dataset.s);
  }
}
document.addEventListener('pointerdown',ev=>{
  if(tab!=='week'||ev.button>0||drag)return;
  const el=ev.target.closest?ev.target.closest('.slot:not(.empty), .favrow'):null;
  if(!el||(el.classList.contains('favrow')&&ev.target.closest('.star')))return;
  press={el,x:ev.clientX,y:ev.clientY,timer:setTimeout(startDrag,350)};
});
document.addEventListener('pointermove',ev=>{
  if(drag){
    drag.x=ev.clientX;drag.y=ev.clientY;moveGhost();updateTarget();
    drag.dir=ev.clientY<90?-1:ev.clientY>window.innerHeight-110?1:0;
    return;
  }
  if(press&&Math.hypot(ev.clientX-press.x,ev.clientY-press.y)>10){clearTimeout(press.timer);press=null}
});
document.addEventListener('pointerup',()=>finishDrag(false));
document.addEventListener('pointercancel',()=>finishDrag(true));
document.addEventListener('touchmove',ev=>{if(drag)ev.preventDefault()},{passive:false});
document.addEventListener('contextmenu',ev=>{if(ev.target.closest&&ev.target.closest('.slot, .favrow'))ev.preventDefault()});

// Symbol für den Home-Bildschirm
try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#2F4BDB';x.fillRect(0,0,180,180);
  x.fillStyle='#F4D64E';x.beginPath();x.arc(90,90,44,0,Math.PI*2);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(90,90,26,0,Math.PI*2);x.fill();
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
}catch(e){}

render();
if(CLOUD)startCloud();
})();
</script>
</body>
